# Identity Service (auth-service) Application Configuration
# Standalone service — own process, own port, shares the NextTrade database.
# Database and security settings are externalized via environment variables.

spring:
  application:
    name: auth-service

  datasource:
    # PostgreSQL JDBC connection — same database as nexttrade-backend
    url: jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:nexttrade}
    username: ${DB_APP_USERNAME:app_user}
    password: ${DB_APP_PASSWORD:my_app_password}

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      # ddl-auto: validate - do not create/update schema; admin role handles migrations
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

  jpa.show-sql: false

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8081
  # Direct TLS only. Missing certificate/key configuration fails startup closed.
  ssl:
    enabled: true
    key-store: ${TLS_KEYSTORE:file:./certs/auth-service.p12}
    key-store-type: PKCS12
    key-store-password: ${TLS_KEYSTORE_PASSWORD:}
    enabled-protocols: TLSv1.2,TLSv1.3
  # A caller cannot claim HTTPS by sending Forwarded or X-Forwarded-Proto.
  forward-headers-strategy: none
  tomcat:
    accesslog:
      enabled: false
  error:
    include-message: never
    include-binding-errors: never
  servlet:
    context-path: /auth
