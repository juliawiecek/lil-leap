# Confirm this existing key against the instructor's assigned team project before running.
sonar.projectKey=LilLeap-Project
sonar.projectName=LilLeap-Project
sonar.host.url=http://10.14.137.118:9000
sonar.sourceEncoding=UTF-8

# Analyze all required services in a single repository-level SonarQube project.
sonar.sources=nextTrade-orders/src/main/java,nextTrade-holdings/src/main/java,insights/src/main/java,auth/src,data-pipeline/src,frontend/src,insights-frontend/src,frontend-shared,nextTrade-orders/pom.xml,nextTrade-holdings/pom.xml,insights/pom.xml,nextTrade-orders/src/main/resources/logback-spring.xml,nextTrade-holdings/src/main/resources/logback-spring.xml,insights/src/main/resources/logback-spring.xml,nextTrade-orders/Dockerfile,nextTrade-holdings/Dockerfile,insights/Dockerfile,auth/Dockerfile,data-pipeline/Dockerfile,frontend/Dockerfile,insights-frontend/Dockerfile
sonar.tests=nextTrade-orders/src/test/java,nextTrade-holdings/src/test/java,insights/src/test/java,auth/src,data-pipeline/tests,frontend/tests,insights-frontend/tests

# Keep test identification explicit where tests share source trees (e.g., *.spec.ts).
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.spec.ts,**/*.test.mjs,data-pipeline/tests/**/*.py

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/coverage/**,**/htmlcov/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/*.min.js
sonar.cpd.exclusions=**/Dockerfile,**/nginx.conf,**/src/main/java/com/neueda/leap/security/**,**/src/main/java/com/neueda/leap/config/SecurityConfig.java

# Java bytecode and JaCoCo XML coverage reports.
sonar.java.source=17
sonar.java.binaries=nextTrade-orders/target/classes,nextTrade-holdings/target/classes,insights/target/classes
# Jenkins copies Maven dependencies (including test scope) before analysis.
sonar.java.libraries=nextTrade-orders/target/sonar-libraries/*.jar,nextTrade-holdings/target/sonar-libraries/*.jar,insights/target/sonar-libraries/*.jar
sonar.java.test.binaries=nextTrade-orders/target/test-classes,nextTrade-holdings/target/test-classes,insights/target/test-classes
sonar.java.test.libraries=nextTrade-orders/target/sonar-libraries/*.jar,nextTrade-holdings/target/sonar-libraries/*.jar,insights/target/sonar-libraries/*.jar
sonar.coverage.jacoco.xmlReportPaths=nextTrade-orders/target/site/jacoco/jacoco.xml,nextTrade-holdings/target/site/jacoco/jacoco.xml,insights/target/site/jacoco/jacoco.xml

# Node/Nest/Angular coverage from lcov output.
sonar.javascript.lcov.reportPaths=auth/coverage/lcov.info,frontend/coverage/lcov.info,insights-frontend/coverage/lcov.info

# Python coverage report from pytest-cov.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=data-pipeline/coverage.xml

# Quality Profiles are restored and assigned by language on the SonarQube server.
# See sonarqube-config/README.md; profile XML paths are not scanner properties.

