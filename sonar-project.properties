# Confirm this existing key against the instructor's assigned team project before running.
sonar.projectKey=LilLeap-Project
sonar.projectName=LilLeap-Project
sonar.host.url=http://10.14.137.118:9000
sonar.sourceEncoding=UTF-8

# Analyze all required services in a single repository-level SonarQube project.
sonar.sources=shared/session-core/src,nextTrade-orders/src/main/java,nextTrade-holdings/src/main/java,insights/src/main/java,auth/src,frontend/src,insights-frontend/src,nextTrade-orders/pom.xml,nextTrade-holdings/pom.xml,insights/pom.xml,nextTrade-orders/src/main/resources/logback-spring.xml,nextTrade-holdings/src/main/resources/logback-spring.xml,insights/src/main/resources/logback-spring.xml,nextTrade-orders/Dockerfile,nextTrade-holdings/Dockerfile,insights/Dockerfile,auth/Dockerfile,frontend/Dockerfile,insights-frontend/Dockerfile
sonar.tests=shared/session-core/tests,nextTrade-orders/src/test/java,nextTrade-holdings/src/test/java,insights/src/test/java,auth/src,frontend/tests,insights-frontend/tests

# Keep test identification explicit where tests share source trees (e.g., *.spec.ts).
sonar.test.inclusions=**/*Test.java,**/*Tests.java,**/*.spec.ts,**/*.test.mjs

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/coverage/**,**/htmlcov/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/*.min.js
# Startup and API-docs wiring only: no business logic, and no unit test can start them without
# booting the whole service. Every other source file still counts toward coverage.
sonar.coverage.exclusions=**/src/main/java/com/neueda/leap/Main.java,**/src/main/java/com/neueda/leap/config/OpenApiConfig.java,**/src/main/java/com/neueda/leap/config/SpringDocConfig.java,auth/src/main.ts,auth/src/app.module.ts
sonar.cpd.exclusions=**/Dockerfile,**/nginx.conf,**/src/main/java/com/neueda/leap/security/**,**/src/main/java/com/neueda/leap/config/SecurityConfig.java

# Java bytecode and JaCoCo XML coverage reports.
sonar.java.source=17
sonar.java.binaries=nextTrade-orders/target/classes,nextTrade-holdings/target/classes,insights/target/classes
# Jenkins copies Maven dependencies (including test scope) before analysis.
sonar.java.libraries=nextTrade-orders/target/sonar-libraries/*.jar,nextTrade-holdings/target/sonar-libraries/*.jar,insights/target/sonar-libraries/*.jar
sonar.java.test.binaries=nextTrade-orders/target/test-classes,nextTrade-holdings/target/test-classes,insights/target/test-classes
sonar.java.test.libraries=nextTrade-orders/target/sonar-libraries/*.jar,nextTrade-holdings/target/sonar-libraries/*.jar,insights/target/sonar-libraries/*.jar
sonar.coverage.jacoco.xmlReportPaths=nextTrade-orders/target/site/jacoco/sonar-jacoco.xml,nextTrade-holdings/target/site/jacoco/sonar-jacoco.xml,insights/target/site/jacoco/sonar-jacoco.xml

# Node/Nest/Angular coverage from lcov output.
sonar.javascript.lcov.reportPaths=shared/session-core/coverage/lcov.info,auth/coverage/lcov.info,frontend/coverage/lcov.info,insights-frontend/coverage/lcov.info

# Quality Profiles are restored and assigned by language on the SonarQube server.
# See sonarqube-config/README.md; profile XML paths are not scanner properties.

