<app-novice-dashboard
  [hidden]="mode() !== 'NOVICE'"
  [name]="name()"
  [mode]="mode()"
  (signOut)="signOut.emit()"
  (advanced)="setMode('ADVANCED')"
/>
<app-advanced-dashboard
  [hidden]="mode() !== 'ADVANCED'"
  [name]="name()"
  [mode]="mode()"
  (signOut)="signOut.emit()"
  (novice)="setMode('NOVICE')"
/>
