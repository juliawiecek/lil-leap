# The same-origin entry points for both clients. Only this container is public.
map $request_method $order_backend {
    default orders:8082;
    GET holdings:8080;
    HEAD holdings:8080;
}
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    include /etc/nginx/listeners/trading.conf;
    server_name _;
    include /etc/nginx/routes/proxy-headers.conf;

    location /auth/ { proxy_pass http://auth:8081; }
    location /rules/ { proxy_pass http://auth:8081; }
    location = /api/v1/orders { proxy_pass http://$order_backend; }
    location ~ ^/api/v1/quotes/(latest/|history/) { proxy_pass http://holdings:8080; }
    location ~ ^/api/v1/clients/[^/]+/(cash|holdings)$ { proxy_pass http://holdings:8080; }
    location /api/v1/quotes/ { proxy_pass http://quote-service:8083; }
    location ~ ^/api/v1/(accounts|holdings|cash|instruments)(/|$) { proxy_pass http://holdings:8080; }
    location /api/ { return 404; }
    location / { proxy_pass http://frontend:80; }
}

server {
    include /etc/nginx/listeners/reporting.conf;
    server_name _;
    include /etc/nginx/routes/proxy-headers.conf;

    location /auth/ { proxy_pass http://auth:8081; }
    location /api/v1/reports/ { proxy_pass http://insights:8084; }
    location /api/ { return 404; }
    location / { proxy_pass http://insights-frontend:80; }
}
