# AWS (ECS Fargate) variant of nginx.conf; local compose keeps using nginx.conf.
# Backends are Cloud Map names in the nexttrade.local namespace. Every proxy_pass goes
# through a variable so nginx re-resolves through the VPC resolver: Fargate tasks get a
# new IP on each deploy, and a literal host would be cached from startup (or fail the boot).
resolver 169.254.169.253 valid=10s ipv6=off;
map $request_method $order_backend {
    default orders.nexttrade.local:8082;
    GET holdings.nexttrade.local:8080;
    HEAD holdings.nexttrade.local:8080;
}

server {
    listen 4200;
    server_name _;
    include /etc/nginx/routes/proxy-headers.conf;
    set $auth auth.nexttrade.local:8081;
    set $orders orders.nexttrade.local:8082;
    set $holdings holdings.nexttrade.local:8080;
    set $frontend frontend.nexttrade.local:8080;

    # ALB health check: answers without depending on any backend.
    location = /healthz { access_log off; return 200 'ok'; }
    location /auth/ { proxy_pass http://$auth; }
    location /rules/ { proxy_pass http://$auth; }
    location = /api/v1/orders { proxy_pass http://$order_backend; }
    location ~ "^/api/v1/orders/[0-9a-fA-F-]{36}(/status|/events|/cancel)?$" { proxy_pass http://$orders; }
    location = /api/v1/orders/quote-preview { proxy_pass http://$orders; }
    location = /api/v1/orders/presets { proxy_pass http://$orders; }
    location = /api/v1/market/status { proxy_pass http://$orders; }
    location ~ ^/api/v1/quotes/(latest/|history/|candles/|day-opens$) { proxy_pass http://$holdings; }
    location ~ ^/api/v1/clients/[^/]+/(cash|holdings|orders|portfolio-summary)$ { proxy_pass http://$holdings; }
    location ~ ^/api/v1/(accounts|holdings|cash|instruments)(/|$) { proxy_pass http://$holdings; }
    location /api/ { return 404; }
    location / { proxy_pass http://$frontend; }
}

server {
    listen 4201;
    server_name _;
    include /etc/nginx/routes/proxy-headers.conf;
    set $auth auth.nexttrade.local:8081;
    set $insights insights.nexttrade.local:8084;
    set $insights_frontend insights-frontend.nexttrade.local:8080;

    location = /healthz { access_log off; return 200 'ok'; }
    location /auth/ { proxy_pass http://$auth; }
    location /api/v1/reports/ { proxy_pass http://$insights; }
    location /api/v1/trades/ { proxy_pass http://$insights; }
    location /api/ { return 404; }
    location / { proxy_pass http://$insights_frontend; }
}
