# Local email configuration for password reset.
# Environment variables can override these values when running in Docker or production.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Frontend page opened when a user clicks the password reset link.
app.password-reset.url=${PASSWORD_RESET_URL:https://localhost:4200/reset-password}
