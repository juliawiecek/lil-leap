spring:
  application:
    name: insights
  datasource:
    url: jdbc:postgresql://${REPORTING_DB_HOST:reporting-db}:${DB_PORT:5432}/${DB_NAME:nexttrade}
    username: ${REPORTING_DB_USERNAME:reporting_user}
    password: ${REPORTING_DB_PASSWORD:reporting_dev_password}
    hikari:
      read-only: true
      maximum-pool-size: 10
  mvc:
    log-request-details: false
app:
  jwt:
    secret: ${APP_JWT_SECRET:nexttrade-shared-dev-secret-32bytes-min}
server:
  port: ${PORT:8084}
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.springframework.jdbc: WARN
