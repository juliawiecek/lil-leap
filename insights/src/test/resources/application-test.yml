spring:
  application:
    name: nexttrade-backend

  datasource:
    # Use H2 in-memory database for integration tests
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Auto-create tables for testing, drop after each test
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true
    show-sql: false

  # Enable H2 console for debugging if needed
  h2:
    console:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# NextTrade custom application configuration
nexttrade:
  security:
    ssn-encryption-key: test_key_for_testing_only
  session:
    inactivity-minutes: 10

server:
  port: 8080
  servlet:
    context-path: /api/v1
