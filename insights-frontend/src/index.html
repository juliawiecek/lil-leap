<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NextTrade — Internal Insights</title>
    <base href="/" />
    <script src="assistive-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070807" />
    <meta
      name="description"
      content="NextTrade internal reporting and trade investigation workspace."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #070807; }
      .startup-loader { position: fixed; inset: 0; display: grid; place-items: center; }
      .startup-spinner {
        width: 32px; height: 32px; border: 3px solid #94c97333;
        border-top-color: #94c973; border-radius: 50%;
        animation: startup-spin 0.8s linear infinite;
      }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .startup-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <app-root>
      <div class="startup-loader" role="status" aria-label="Loading session">
        <span class="startup-spinner" aria-hidden="true"></span>
      </div>
    </app-root>
  </body>
</html>
