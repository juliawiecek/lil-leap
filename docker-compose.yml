services:
  app:
    build: ./backend
    # No ports: mapping — the app service is intentionally unreachable from the
    # host. It can reach `db` by the service name "db" (Docker bridge DNS),
    # but nothing outside Docker can reach `app` unless a ports: entry is added.
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nexttrade
      # app_user is a restricted role (DML only, no CREATE/DROP/ALTER) — see
      # db/init-app-role.sh. It is separate from "main", which owns the schema
      # and runs migrations.
      SPRING_DATASOURCE_USERNAME: app_user
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD}

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexttrade
      POSTGRES_USER: main
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Read by init-app-role.sh to create the restricted app_user role.
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      # Only db is reachable from the host. app is not. This mirrors a real
      # deployment where the database is internal but needs to be accessible
      # to DBA tooling running on the developer's machine during development.
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Numeric prefixes control init order: schema first, then the
      # restricted app role. Both only run once, against an empty volume.
      - ./db/initial-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/init-app-role.sh:/docker-entrypoint-initdb.d/02-app-role.sh

volumes:
  db_data:
    # Named volume: persists Postgres data across `docker compose down` and
    # `docker compose up`. Use `docker compose down -v` to also remove this
    # volume, which wipes the database and starts fresh on the next `up`.