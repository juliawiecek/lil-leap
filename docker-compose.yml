# Diagram ports: Holdings 8080, Identity 8081, Orders 8082, Insights 8084 (Holdings also generates quotes).
# Services stay internal; the gateway serves both clients on 4200/4201.
x-primary-database: &primary-database
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: nexttrade
  DB_APP_USERNAME: app_user
  DB_APP_PASSWORD: ${DB_APP_PASSWORD:-my_app_password}
x-jwt: &jwt
  APP_JWT_SECRET: ${APP_JWT_SECRET:-nexttrade-shared-dev-secret-32bytes-min}

services:
  gateway:
    image: nginx:1.27-alpine
    ports: ["4200:4200", "4201:4201"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/proxy-headers.conf:/etc/nginx/routes/proxy-headers.conf:ro
      - ./gateway/http-trading.conf:/etc/nginx/listeners/trading.conf:ro
      - ./gateway/http-reporting.conf:/etc/nginx/listeners/reporting.conf:ro
    depends_on: [frontend, insights-frontend, auth, holdings, orders, insights]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
  insights-frontend:
    build:
      context: .
      dockerfile: insights-frontend/Dockerfile

  auth:
    build: ./auth
    environment:
      <<: [*primary-database, *jwt]
      PORT: 8081
      SSN_ENCRYPTION_KEY: ${SSN_ENCRYPTION_KEY:-replace_me}
      NEXTTRADE_SECURITY_SSN_ENCRYPTION_KEY: ${SSN_ENCRYPTION_KEY:-replace_me}
      SESSION_INACTIVITY_MINUTES: ${SESSION_INACTIVITY_MINUTES:-10}
      # No network on the VM: reset emails are .eml files here. Read them with
      # docker-compose exec auth sh -c 'cat /app/outbox/*.eml'
      PASSWORD_RESET_OUTBOX_DIR: /app/outbox
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:4200/reset-password}
    volumes:
      - password_reset_outbox:/app/outbox
    depends_on:
      db: {condition: service_healthy}

  holdings:
    build: ./nextTrade-holdings
    environment:
      <<: [*primary-database, *jwt]
      PORT: 8080
      # Holdings also generates the live synthetic quotes orders fill against.
      QUOTE_INTERVAL_SECONDS: ${QUOTE_INTERVAL_SECONDS:-2}
      QUOTE_SEED: ${QUOTE_SEED:-42}
    depends_on:
      db: {condition: service_healthy}

  orders:
    build: ./nextTrade-orders
    environment:
      <<: [*primary-database, *jwt]
      PORT: 8082
      # Demo switch: false lets orders fill outside NYSE hours (NEXT-212).
      NEXTTRADE_MARKET_RESPECT_HOURS: ${NEXTTRADE_MARKET_RESPECT_HOURS:-true}
    depends_on:
      db: {condition: service_healthy}

  # BR-16: every Insights page reads the read-only replica, never the main database, so it cannot load live trading.
  insights:
    build: ./insights
    environment:
      <<: *jwt
      PORT: 8084
      DB_HOST: reporting-db
      DB_PORT: 5432
      DB_NAME: nexttrade
      DB_APP_USERNAME: reporting_user
      DB_APP_PASSWORD: ${REPORTING_DB_PASSWORD:-reporting_dev_password}
    depends_on:
      reporting-db: {condition: service_healthy}

  db:
    image: postgres:16-alpine
    # Replication settings and db/pg_hba.conf come from here, not the volume, so existing volumes get them too.
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10", "-c", "max_slot_wal_keep_size=1GB", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_DB: nexttrade
      POSTGRES_USER: main
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-main_password}
      DB_APP_USERNAME: app_user
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-my_app_password}
      # Same key as auth, so seeded SSNs decrypt like registered ones (05-test-users.sql).
      SSN_ENCRYPTION_KEY: ${SSN_ENCRYPTION_KEY:-replace_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/finalized-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init-app-role.sh:/docker-entrypoint-initdb.d/02-app-role.sh:ro
      - ./db/seeds/001_us_equity_instruments.sql:/docker-entrypoint-initdb.d/03-us-equities.sql:ro
      # Dev/demo test logins (TS-DB-04). Never mount this in a production compose file.
      - ./db/seeds/002_test_users.sql:/docker-entrypoint-initdb.d/05-test-users.sql:ro
      # Demo clients and trade book, which Insights reads through the replica. Dev/demo only.
      - ./db/seeds/003_demo_trading_activity.sql:/docker-entrypoint-initdb.d/06-demo-trading-activity.sql:ro

  # Runs on every start and exits: the trader-name view (migration 018), then the reporting role and replication
  # slot (db/init-reporting.sh). All idempotent, so new and existing volumes get the replica with no manual step.
  reporting-setup:
    image: postgres:16-alpine
    entrypoint: ["bash", "-c", "psql -v ON_ERROR_STOP=1 -f /reporting/018_trade_clients.sql && bash /reporting/init-reporting.sh"]
    environment:
      PGHOST: db
      PGUSER: main
      PGDATABASE: nexttrade
      PGPASSWORD: ${POSTGRES_PASSWORD:-main_password}
      POSTGRES_USER: main
      POSTGRES_DB: nexttrade
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:-reporting_dev_password}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replication_dev_password}
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - ./db/migrations/018_trade_clients.sql:/reporting/018_trade_clients.sql:ro
      - ./db/init-reporting.sh:/reporting/init-reporting.sh:ro

  # Streaming read-only copy of db for Insights (db/start-reporting-replica.sh).
  reporting-db:
    image: postgres:16-alpine
    entrypoint: ["bash", "/usr/local/bin/start-reporting-replica.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_DB_HOST: db
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replication_dev_password}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:-reporting_dev_password}
    depends_on:
      reporting-setup: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$REPORTING_DB_PASSWORD\" psql -h 127.0.0.1 -U reporting_user -d nexttrade -tAc 'SELECT pg_is_in_recovery()' | grep -qx t"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - reporting_data:/var/lib/postgresql/data
      - ./db/start-reporting-replica.sh:/usr/local/bin/start-reporting-replica.sh:ro

volumes:
  db_data:
  reporting_data:
  password_reset_outbox:
