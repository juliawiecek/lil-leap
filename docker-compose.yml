services:
  app:
    build: ./backend
    # No ports: mapping — the app service is intentionally unreachable from the
    # host. It can reach `db` by the service name "db" (Docker bridge DNS),
    # but nothing outside Docker can reach `app` unless a ports: entry is added.
    depends_on:
      - db
      - mailpit
    environment:
      # Spring Boot datasource configuration using environment variables
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_APP_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD}
      # Application-specific configuration
      NEXTTRADE_SECURITY_SSN_ENCRYPTION_KEY: ${SSN_ENCRYPTION_KEY}
      NEXTTRADE_SESSION_INACTIVITY_MINUTES: ${SESSION_INACTIVITY_MINUTES}
      # Mailpit SMTP configuration for local development.
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
    # Note: app_user is a restricted role (DML only, no CREATE/DROP/ALTER) — see
    # db/init-app-role.sh. It is separate from the admin role, which owns the
    # schema and runs migrations.

  db:
    image: postgres:16-alpine
    environment:
      # PostgreSQL server configuration using environment variables
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USERNAME}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      # Application role configuration for init-app-role.sh
      DB_APP_USERNAME: ${DB_APP_USERNAME}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    ports:
      # Publish PostgreSQL using configurable port
      # Only db is reachable from the host. This mirrors a real deployment
      # where the database is internal but needs to be accessible to DBA
      # tooling running on the developer's machine.
      - "${DB_PUBLISHED_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_ADMIN_USERNAME} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data
      # Numeric prefixes control init order: schema first, then the
      # restricted app role. Both only run once, against an empty volume.
      - ./db/finalized-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/init-app-role.sh:/docker-entrypoint-initdb.d/02-app-role.sh:ro

  # Local SMTP server used to capture password reset emails during development.
  mailpit:
    image: axllent/mailpit
    ports:
      # Spring Boot sends email through SMTP on port 1025.
      - "1025:1025"
      # Mailpit's browser inbox is available on port 8025.
      - "8025:8025"

volumes:
  db_data:
    # Named volume: persists Postgres data across `docker compose down` and
    # `docker compose up`. Use `docker compose down -v` to also remove this
    # volume, which wipes the database and starts fresh on the next `up`.