# Optional development broker for shared order lifecycle events.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
  kafka:
    build: ./kafka
    depends_on: [zookeeper]
    ports: ["127.0.0.1:29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data
  kafka-topics:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka/topics/create-topics.sh:/scripts/create-topics.sh:ro
  orders:
    depends_on:
      db: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDERS_KAFKA_TOPIC: order-events
  insights:
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INSIGHTS_KAFKA_TOPIC: order-events
      INSIGHTS_KAFKA_OUTPUT_DIR: /var/lib/insights-kafka
    volumes:
      - insights_kafka_data:/var/lib/insights-kafka
volumes:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  insights_kafka_data:
