# Client authentication for the compose `db` service (BR-16), read via -c hba_file so it also applies to
# volumes created before the reporting replica existed. Same rules as the postgres image default, plus
# streaming replication for the `replicator` role used by `reporting-db`.
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     replicator      all                     scram-sha-256
host    all             all             all                     scram-sha-256
