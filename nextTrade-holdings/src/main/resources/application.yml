spring:
  application:
    name: nextTrade-holdings
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexttrade}
    username: ${DB_APP_USERNAME:app_user}
    password: ${DB_APP_PASSWORD:my_app_password}
    hikari:
      read-only: false
      maximum-pool-size: 10
      # Candle reads sort one instrument's whole quote history; the 4 MB default spills that sort to disk.
      connection-init-sql: SET work_mem = '64MB'
  mvc:
    log-request-details: false
app:
  jwt:
    secret: ${APP_JWT_SECRET}
# Live synthetic prices for every catalog stock (replaces the retired Python quote service).
marketdata:
  quotes:
    generator:
      enabled: ${QUOTE_GENERATOR_ENABLED:true}
      interval-seconds: ${QUOTE_INTERVAL_SECONDS:2}
      seed: ${QUOTE_SEED:42}
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
logging:
  level:
    root: INFO
    org.springframework.web: WARN
    org.springframework.jdbc: WARN
